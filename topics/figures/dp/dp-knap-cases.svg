<svg xmlns="http://www.w3.org/2000/svg" width="727" height="166" viewBox="0 0 727 166" role="img" font-family="system-ui, sans-serif" aria-label="The four outcomes of a knapsack cell, each shown as the cell (amber), the cell above it (skip) and, when the item fits, the cell one row up and w_i columns left (take, plus the item's value); the source taken is green. Does not fit: K[3][3] copies 4 from above, since item C weighs 4. Fits and take wins: K[3][4] = max(4, 5 + K[2][0] = 5) = 5. Fits and skip wins: K[3][5] = max(7, 5 + K[2][1] = 5) = 7. A tie: K[4][7] = max(9, 6 + K[3][2] = 9) = 9, both sources green.">
<rect width="727" height="166" fill="#fff"/>
<text x="97" y="25.6" font-size="15" font-weight="600" fill="#2a2d36" text-anchor="middle">does not fit</text>
<text x="111.1" y="51" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="middle">3</text>
<text x="81.1" y="81" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="end">+B</text>
<text x="81.1" y="119" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="end">+C</text>
<rect x="89.1" y="58" width="44" height="38" fill="#eaf6ef" stroke="#c8ccd6" stroke-width="1"/>
<rect x="89.1" y="96" width="44" height="38" fill="#fde7bf" stroke="#c8ccd6" stroke-width="1"/>
<rect x="91.1" y="98" width="40" height="34" rx="3" fill="none" stroke="#c98a1a" stroke-width="1.8"/>
<line x1="111.1" y1="87" x2="111.1" y2="100" stroke="#0a7d4d" stroke-width="2.2" stroke-linecap="round"/><path d="M111.1,105 L107.8,98.5 L114.3,98.5 Z" fill="#0a7d4d"/>
<text x="111.1" y="81.5" font-size="13" font-weight="600" fill="#0a7d4d" text-anchor="middle" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">4</text>
<text x="111.1" y="119.5" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">4</text>
<text x="97" y="150.8" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">C weighs 4 &gt; 3: copy 4</text>

<text x="293.7" y="25.6" font-size="15" font-weight="600" fill="#2a2d36" text-anchor="middle">fits, take wins</text>
<text x="285.8" y="51" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="middle">0</text>
<text x="329.8" y="51" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="middle">4</text>
<text x="255.8" y="81" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="end">+B</text>
<text x="255.8" y="119" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="end">+C</text>
<rect x="263.8" y="58" width="44" height="38" fill="#eaf6ef" stroke="#c8ccd6" stroke-width="1"/>
<rect x="307.8" y="58" width="44" height="38" fill="#fff" stroke="#c8ccd6" stroke-width="1"/>
<rect x="307.8" y="96" width="44" height="38" fill="#fde7bf" stroke="#c8ccd6" stroke-width="1"/>
<rect x="309.8" y="98" width="40" height="34" rx="3" fill="none" stroke="#c98a1a" stroke-width="1.8"/>
<line x1="329.8" y1="87" x2="329.8" y2="100" stroke="#9aa3b5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M329.8,105 L326.5,98.5 L333,98.5 Z" fill="#9aa3b5"/>
<line x1="294.2" y1="84.3" x2="317.6" y2="104.5" stroke="#0a7d4d" stroke-width="2.2" stroke-linecap="round"/><path d="M321.4,107.7 L314.3,106 L318.6,101 Z" fill="#0a7d4d"/>
<text stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke" x="285.8" y="119" font-size="13.2" font-weight="600" fill="#0a7d4d" text-anchor="middle">+ 5</text>
<text x="285.8" y="81.5" font-size="13" font-weight="600" fill="#0a7d4d" text-anchor="middle" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">0</text>
<text x="329.8" y="81.5" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">4</text>
<text x="329.8" y="119.5" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">5</text>
<text x="293.7" y="150.8" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">max(4, 5 + 0) = 5</text>

<text x="471.1" y="25.6" font-size="15" font-weight="600" fill="#2a2d36" text-anchor="middle">fits, skip wins</text>
<text x="463.1" y="51" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="middle">1</text>
<text x="507.1" y="51" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="middle">5</text>
<text x="433.1" y="81" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="end">+B</text>
<text x="433.1" y="119" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="end">+C</text>
<rect x="441.1" y="58" width="44" height="38" fill="#fff" stroke="#c8ccd6" stroke-width="1"/>
<rect x="485.1" y="58" width="44" height="38" fill="#eaf6ef" stroke="#c8ccd6" stroke-width="1"/>
<rect x="485.1" y="96" width="44" height="38" fill="#fde7bf" stroke="#c8ccd6" stroke-width="1"/>
<rect x="487.1" y="98" width="40" height="34" rx="3" fill="none" stroke="#c98a1a" stroke-width="1.8"/>
<line x1="507.1" y1="87" x2="507.1" y2="100" stroke="#0a7d4d" stroke-width="2.2" stroke-linecap="round"/><path d="M507.1,105 L503.9,98.5 L510.4,98.5 Z" fill="#0a7d4d"/>
<line x1="471.5" y1="84.3" x2="495" y2="104.5" stroke="#9aa3b5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M498.7,107.7 L491.7,106 L496,101 Z" fill="#9aa3b5"/>
<text stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke" x="463.1" y="119" font-size="13.2" font-weight="600" fill="#9aa3b5" text-anchor="middle">+ 5</text>
<text x="463.1" y="81.5" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">0</text>
<text x="507.1" y="81.5" font-size="13" font-weight="600" fill="#0a7d4d" text-anchor="middle" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">7</text>
<text x="507.1" y="119.5" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">7</text>
<text x="471.1" y="150.8" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">max(7, 5 + 0) = 7</text>

<text x="648.5" y="25.6" font-size="15" font-weight="600" fill="#2a2d36" text-anchor="middle">fits, a tie</text>
<text x="640.5" y="51" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="middle">2</text>
<text x="684.5" y="51" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="middle">7</text>
<text x="610.5" y="81" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="end">+C</text>
<text x="610.5" y="119" font-size="14.4" font-weight="600" fill="#5c6270" text-anchor="end">+D</text>
<rect x="618.5" y="58" width="44" height="38" fill="#eaf6ef" stroke="#c8ccd6" stroke-width="1"/>
<rect x="662.5" y="58" width="44" height="38" fill="#eaf6ef" stroke="#c8ccd6" stroke-width="1"/>
<rect x="662.5" y="96" width="44" height="38" fill="#fde7bf" stroke="#c8ccd6" stroke-width="1"/>
<rect x="664.5" y="98" width="40" height="34" rx="3" fill="none" stroke="#c98a1a" stroke-width="1.8"/>
<line x1="684.5" y1="87" x2="684.5" y2="100" stroke="#0a7d4d" stroke-width="2.2" stroke-linecap="round"/><path d="M684.5,105 L681.3,98.5 L687.8,98.5 Z" fill="#0a7d4d"/>
<line x1="648.9" y1="84.3" x2="672.3" y2="104.5" stroke="#0a7d4d" stroke-width="2.2" stroke-linecap="round"/><path d="M676.1,107.7 L669.1,106 L673.3,101 Z" fill="#0a7d4d"/>
<text stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke" x="640.5" y="119" font-size="13.2" font-weight="600" fill="#0a7d4d" text-anchor="middle">+ 6</text>
<text x="640.5" y="81.5" font-size="13" font-weight="600" fill="#0a7d4d" text-anchor="middle" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">3</text>
<text x="684.5" y="81.5" font-size="13" font-weight="600" fill="#0a7d4d" text-anchor="middle" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">9</text>
<text x="684.5" y="119.5" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">9</text>
<text x="648.5" y="150.8" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">max(9, 6 + 3) = 9</text>
</svg>
