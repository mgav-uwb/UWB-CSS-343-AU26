<svg xmlns="http://www.w3.org/2000/svg" width="405" height="270" viewBox="0 0 405 270" role="img" font-family="system-ui, sans-serif" aria-label="The LCS table for AGCAT (rows) and GAC (columns), walked back twice from the bottom-right cell; amber cells are ties, where up and left hold the same length. Going up on every tie meets ties at (5,3), (4,3) and (2,2) and spells AC; going left meets the tie at (5,3) only and spells GA. Both are LCSs of length 2. on a tie, go up: columns “”, G, A, C; rows “”: 0 0 0 0; A: 0 0 1 1; G: 0 1 1 1; C: 0 1 1 2; A: 0 1 2 2; T: 0 1 2 2; the traceback visits (5,3), (4,3), (3,3), (2,2), (1,2), (0,1) (spells AC). on a tie, go left: columns “”, G, A, C; rows “”: 0 0 0 0; A: 0 0 1 1; G: 0 1 1 1; C: 0 1 1 2; A: 0 1 2 2; T: 0 1 2 2; the traceback visits (5,3), (5,2), (4,2), (3,1), (2,1), (1,0) (spells GA).">
