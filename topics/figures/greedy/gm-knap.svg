<svg xmlns="http://www.w3.org/2000/svg" width="715" height="125" viewBox="0 0 715 125" role="img" font-family="system-ui, sans-serif" aria-label="A bag of capacity 50 kg packed two ways. Greedy by value per kilo takes A (10 kg, value 60), then B (20 kg, value 100), and C (30 kg) no longer fits: value 160 with 20 kg unused. The optimum packs B and C, exactly 50 kg: value 220.">
<rect width="715" height="125" fill="#fff"/>
<text x="153.6" y="18.6" font-size="13.8" font-weight="600" fill="#2a2d36" text-anchor="end">by value/weight</text>
<text x="153.6" y="35.4" font-size="13.8" font-weight="400" fill="#2a2d36" text-anchor="end">A (6), B (5), C (4)</text>
<rect x="169.6" y="10" width="400" height="26" fill="#fff"/>
<rect x="169.6" y="10" width="80" height="26" fill="#4285f41f" stroke="#4285f4" stroke-width="1.6"/>
<text x="209.6" y="27.5" font-size="13.8" font-weight="600" fill="#1a1c22" text-anchor="middle">A: 10 kg, 60</text>
<rect x="249.6" y="10" width="160" height="26" fill="#1e8e3e1f" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="329.6" y="27.5" font-size="13.8" font-weight="600" fill="#1a1c22" text-anchor="middle">B: 20 kg, 100</text>
<rect x="409.6" y="10" width="160" height="26" fill="#fff" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="489.6" y="27.5" font-size="13.8" font-weight="600" fill="#c0392b" text-anchor="middle">20 kg unused</text>
<text x="169.6" y="50.4" font-size="12" font-weight="400" fill="#5c6270" text-anchor="middle">0</text>
<text x="569.6" y="50.4" font-size="12" font-weight="400" fill="#5c6270" text-anchor="middle">50</text>
<text x="585.6" y="18.6" font-size="13.8" font-weight="600" fill="#5c6270" text-anchor="start">value 160</text>
<text x="585.6" y="35.4" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="start">C no longer fits</text>
<text x="153.6" y="86.2" font-size="13.8" font-weight="600" fill="#2a2d36" text-anchor="end">the optimum</text>
<rect x="169.6" y="69.2" width="400" height="26" fill="#fff"/>
<rect x="169.6" y="69.2" width="160" height="26" fill="#1e8e3e1f" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="249.6" y="86.7" font-size="13.8" font-weight="600" fill="#1a1c22" text-anchor="middle">B: 20 kg, 100</text>
<rect x="329.6" y="69.2" width="240" height="26" fill="#f9ab001f" stroke="#f9ab00" stroke-width="1.6"/>
<text x="449.6" y="86.7" font-size="13.8" font-weight="600" fill="#1a1c22" text-anchor="middle">C: 30 kg, 120</text>
<text x="169.6" y="109.6" font-size="12" font-weight="400" fill="#5c6270" text-anchor="middle">0</text>
<text x="569.6" y="109.6" font-size="12" font-weight="400" fill="#5c6270" text-anchor="middle">50</text>
<text x="585.6" y="86.2" font-size="13.8" font-weight="600" fill="#0a7d4d" text-anchor="start">value 220</text>
</svg>
