<svg xmlns="http://www.w3.org/2000/svg" width="633" height="160" viewBox="0 0 633 160" role="img" font-family="system-ui, sans-serif" aria-label="A round trip with the codes f = 0, c = 100, d = 101, e = 111, a = 1100, b = 1101. Encode &quot;face&quot;: f, a, c, e become 0, 1100, 100, 111, concatenated to 01100100111, 11 bits. Decode 1010: the bits 1, 0, 1 walk to the leaf d; restarting at the root, 0 is the leaf f; the result is df.">
