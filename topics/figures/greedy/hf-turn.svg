<circle cx="181.2" cy="112" r="15" fill="#eef1f6" stroke="#8a9099" stroke-width="1.5"/>
<text x="181.2" y="116.5" font-size="12.5" font-weight="600" fill="#5c6270" text-anchor="middle">5</text>
<circle cx="253.2" cy="154" r="16" fill="#eaf6ef" stroke="#0a7d4d" stroke-width="1.7"/>
