<text x="206.2" y="47" font-size="13.8" font-weight="700" fill="#6b40d8" stroke="#fff" stroke-width="2.5" paint-order="stroke" text-anchor="middle">1</text>
<circle cx="109.2" cy="70" r="16" fill="#eaf6ef" stroke="#0a7d4d" stroke-width="1.7"/>
<text x="109.2" y="75" font-size="15" font-weight="700" fill="#0a7d4d" text-anchor="middle">t</text>
<text x="109.2" y="98" font-size="12.6" font-weight="400" fill="#5c6270" text-anchor="middle">8</text>
<circle cx="157.2" cy="154" r="16" fill="#eaf6ef" stroke="#0a7d4d" stroke-width="1.7"/>
