<text x="169.2" y="32.5" font-size="12.5" font-weight="600" fill="#5c6270" text-anchor="middle">20</text>
<text x="207.2" y="201.6" font-size="13.8" font-weight="600" fill="#2a2d36" text-anchor="middle">merges: p + q → 5, r + s → 7, 5 + 7 → 12, t + 12 → 20</text>
<text x="207.2" y="219.6" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">t = 0, p = 100, q = 101, r = 110, s = 111</text>
<text x="207.2" y="237.6" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">8·1 + (2 + 3 + 3 + 4)·3 = 44 bits</text>
</svg>
