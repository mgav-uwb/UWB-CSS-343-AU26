<text x="277.2" y="116.5" font-size="12.5" font-weight="600" fill="#5c6270" text-anchor="middle">7</text>
<circle cx="229.2" cy="70" r="15" fill="#eef1f6" stroke="#8a9099" stroke-width="1.5"/>
<text x="229.2" y="74.5" font-size="12.5" font-weight="600" fill="#5c6270" text-anchor="middle">12</text>
