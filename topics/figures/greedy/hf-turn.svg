<text x="198.2" y="89" font-size="13.8" font-weight="700" fill="#6b40d8" stroke="#fff" stroke-width="2.5" paint-order="stroke" text-anchor="middle">0</text>
<line x1="229.2" y1="70" x2="277.2" y2="112" stroke="#8a9099" stroke-width="1.6"/>
<text x="260.2" y="89" font-size="13.8" font-weight="700" fill="#6b40d8" stroke="#fff" stroke-width="2.5" paint-order="stroke" text-anchor="middle">1</text>
<line x1="169.2" y1="28" x2="109.2" y2="70" stroke="#8a9099" stroke-width="1.6"/>
