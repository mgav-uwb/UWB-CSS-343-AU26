<svg xmlns="http://www.w3.org/2000/svg" width="415" height="256" viewBox="0 0 415 256" role="img" font-family="system-ui, sans-serif" aria-label="The Huffman tree for p:2, q:3, r:3, s:4, t:8. a node of weight 20 over the leaf t (8) and a node of weight 12 over a node of weight 5 over the leaf p (2) and the leaf q (3) and a node of weight 7 over the leaf r (3) and the leaf s (4). codes t = 0, p = 100, q = 101, r = 110, s = 111; 44 bits.">
