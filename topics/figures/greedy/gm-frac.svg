<svg xmlns="http://www.w3.org/2000/svg" width="670" height="66" viewBox="0 0 670 66" role="img" font-family="system-ui, sans-serif" aria-label="The same bag of 50 kg, packed fractionally. A (10 kg, 60), B (20 kg, 100), then 20 of C's 30 kg (worth 80): value 240.">
<rect width="670" height="66" fill="#fff"/>
<text x="123.4" y="18.6" font-size="13.8" font-weight="600" fill="#2a2d36" text-anchor="end">fractional</text>
<text x="123.4" y="35.4" font-size="13.8" font-weight="400" fill="#2a2d36" text-anchor="end">by value/weight</text>
<rect x="139.4" y="10" width="80" height="26" fill="#4285f41f" stroke="#4285f4" stroke-width="1.6"/>
<text x="179.4" y="27.5" font-size="13.8" font-weight="600" fill="#1a1c22" text-anchor="middle">A: 10 kg, 60</text>
<rect x="219.4" y="10" width="160" height="26" fill="#1e8e3e1f" stroke="#1e8e3e" stroke-width="1.6"/>
<text x="299.4" y="27.5" font-size="13.8" font-weight="600" fill="#1a1c22" text-anchor="middle">B: 20 kg, 100</text>
<rect x="379.4" y="10" width="160" height="26" fill="#f9ab001f" stroke="#f9ab00" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="459.4" y="27.5" font-size="13.8" font-weight="600" fill="#1a1c22" text-anchor="middle">20 of C's 30 kg: 80</text>
<text x="139.4" y="50.4" font-size="12" font-weight="400" fill="#5c6270" text-anchor="middle">0</text>
<text x="539.4" y="50.4" font-size="12" font-weight="400" fill="#5c6270" text-anchor="middle">50</text>
<text x="555.4" y="18.6" font-size="13.8" font-weight="600" fill="#0a7d4d" text-anchor="start">value 240</text>
<text x="555.4" y="35.4" font-size="13.8" font-weight="400" fill="#0a7d4d" text-anchor="start">no kilo unused</text>
</svg>
