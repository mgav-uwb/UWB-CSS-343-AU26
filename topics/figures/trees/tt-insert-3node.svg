<svg xmlns="http://www.w3.org/2000/svg" width="587" height="122" viewBox="0 0 587 122" role="img" font-family="system-ui, sans-serif" aria-label="Inserting 40 into the full 3-node leaf 30, 50. It becomes a temporary 4-node 30, 40, 50 (outlined red, the middle key 40 shaded red), which splits: 40 moves up into a node of its own, over the 2-nodes 30 and 50.">
