<line x1="544.6" y1="36" x2="551.6" y2="64" stroke="#4a5163" stroke-width="1.5"/>
<rect x="517" y="10" width="27.6" height="26" rx="6" fill="#fff"/>
<rect x="517" y="10" width="27.6" height="26" fill="#eaf6ef"/>
<rect x="517" y="10" width="27.6" height="26" rx="6" fill="none" stroke="#2a2d36" stroke-width="1.6"/>
