<line x1="345.4" y1="37" x2="345.4" y2="63" stroke="#c8ccd6" stroke-width="1"/>
<rect x="290.3" y="37" width="82.7" height="26" rx="6" fill="none" stroke="#c0392b" stroke-width="2.1"/>
<text x="304.1" y="55" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">30</text>
<text x="331.7" y="55" font-size="13" font-weight="600" fill="#c0392b" text-anchor="middle">40</text>
