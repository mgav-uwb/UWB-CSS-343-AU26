<text x="200.8" y="44" font-size="24" font-weight="400" fill="#5c6270" text-anchor="middle">→</text>
<text x="200.8" y="63.2" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">insert 40</text>
