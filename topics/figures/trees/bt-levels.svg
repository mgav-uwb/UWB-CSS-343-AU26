<svg xmlns="http://www.w3.org/2000/svg" width="732" height="188" viewBox="0 0 732 188" role="img" font-family="system-ui, sans-serif" aria-label="An order-1000 B-tree, three levels: level 0 is one node of 999 keys; level 1 is 1,000 nodes; level 2 is 1,000,000 nodes. Full, the three levels hold 999,999,999 keys, and a lookup reads one block per level: 3 reads.">
<rect width="732" height="188" fill="#fff"/>
