<text x="322" y="26" font-size="15" font-weight="600" fill="#1a1c22" text-anchor="middle">k<tspan dy="4" font-size="10.8">1</tspan><tspan dy="-4"> | k</tspan><tspan dy="4" font-size="10.8">2</tspan><tspan dy="-4"> | … | k</tspan><tspan dy="4" font-size="10.8">999</tspan></text>
<text x="588" y="26" font-size="15" font-weight="600" fill="#1a1c22" text-anchor="start">1 node</text>
