<svg xmlns="http://www.w3.org/2000/svg" width="657" height="122" viewBox="0 0 657 122" role="img" font-family="system-ui, sans-serif" aria-label="Borrowing. the node 30 at the top; the node 30 has children the node 10, the node 40, 50; deleting 10 empties its leaf. The right sibling 40, 50 has two keys: the parent's 30 comes down into the empty node and 40 goes up, giving the node 40 at the top; the node 40 has children the node 30, the node 50.">
