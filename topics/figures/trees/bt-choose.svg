<text x="85" y="102" font-size="14" font-weight="600" fill="#1a1c22" text-anchor="middle">where does the</text>
<text x="85" y="118" font-size="14" font-weight="600" fill="#1a1c22" text-anchor="middle">data live?</text>
<rect x="280" y="20" width="150" height="34" rx="8" fill="#eaf6ef" stroke="#0a7d4d" stroke-width="1.6"/>
<text x="355" y="42" font-size="14" font-weight="600" fill="#0a7d4d" text-anchor="middle">B+ tree</text>
<rect x="280" y="130" width="150" height="34" rx="8" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
<text x="355" y="152" font-size="14" font-weight="600" fill="#1a1c22" text-anchor="middle">mostly reads?</text>
