<text x="625" y="102" font-size="14" font-weight="600" fill="#0a7d4d" text-anchor="middle">AVL</text>
<rect x="540" y="180" width="170" height="50" rx="8" fill="#eaf6ef" stroke="#0a7d4d" stroke-width="1.6"/>
<text x="625" y="202" font-size="14" font-weight="600" fill="#0a7d4d" text-anchor="middle">red-black</text>
<text x="625" y="218" font-size="12" font-weight="400" fill="#0a7d4d" text-anchor="middle">(std::map, TreeMap)</text>
<text x="10" y="242" font-size="14.4" font-weight="400" fill="#5c6270" text-anchor="start" font-style="italic">2-3 trees: for learning; a red-black tree is a 2-3 tree in binary</text>
