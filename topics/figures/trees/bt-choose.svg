<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" font-family="system-ui, sans-serif" aria-label="Choosing a balanced search tree. Where does the data live? On disk or in a database: a B+ tree. In RAM: if mostly reads, AVL (the tightest balance); with many updates, red-black (std::map, TreeMap). 2-3 trees are for learning: a red-black tree is a 2-3 tree in binary.">
