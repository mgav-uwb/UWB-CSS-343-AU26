<svg xmlns="http://www.w3.org/2000/svg" width="874" height="272" viewBox="0 0 874 272" role="img" font-family="system-ui, sans-serif" aria-label="The five places the empty node can sit, each as a red-black shape above the 2-3 shape it encodes. 2-node parent, left: p at the root; p has left child an empty node (a missing black) by a black link and right child subtree S by a black link; as a 2-3 tree, 2-3 view: the node holding p at the top; the node holding p has children, left to right, an empty node, subtree S. 2-node parent, right: p at the root; p has left child subtree S by a black link and right child an empty node (a missing black) by a black link; as a 2-3 tree, 2-3 view: the node holding p at the top; the node holding p has children, left to right, subtree S, an empty node. 3-node parent, left: g at the root; g has left child r by a red link and right child subtree U by a black link; r has left child an empty node (a missing black) by a black link and right child subtree S by a black link; as a 2-3 tree, 2-3 view: the node holding r and g at the top; the node holding r and g has children, left to right, an empty node, subtree S, subtree U. 3-node parent, middle: g at the root; g has left child r by a red link and right child subtree U by a black link; r has left child subtree S by a black link and right child an empty node (a missing black) by a black link; as a 2-3 tree, 2-3 view: the node holding r and g at the top; the node holding r and g has children, left to right, subtree S, an empty node, subtree U. 3-node parent, right: g at the root; g has left child r by a red link and right child an empty node (a missing black) by a black link; r has left child subtree S by a black link and right child subtree U by a black link; as a 2-3 tree, 2-3 view: the node holding r and g at the top; the node holding r and g has children, left to right, subtree S, subtree U, an empty node. S and U are the sibling subtrees.">
