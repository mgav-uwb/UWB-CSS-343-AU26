<svg xmlns="http://www.w3.org/2000/svg" width="718" height="190" viewBox="0 0 718 190" role="img" font-family="system-ui, sans-serif" aria-label="Access times on a log scale, each grid line ten times the last: a register about 1 nanosecond, RAM about 100 nanoseconds, an SSD about 100 microseconds (about 1,000 times RAM), a spinning disk about 10 milliseconds (about 100,000 times RAM).">
<rect width="718" height="190" fill="#fff"/>
<line x1="86" y1="12" x2="86" y2="158" stroke="#c8ccd6" stroke-width="1"/>
<line x1="140" y1="12" x2="140" y2="158" stroke="#c8ccd6" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="194" y1="12" x2="194" y2="158" stroke="#c8ccd6" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="248" y1="12" x2="248" y2="158" stroke="#c8ccd6" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="302" y1="12" x2="302" y2="158" stroke="#c8ccd6" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="356" y1="12" x2="356" y2="158" stroke="#c8ccd6" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="410" y1="12" x2="410" y2="158" stroke="#c8ccd6" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="464" y1="12" x2="464" y2="158" stroke="#c8ccd6" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="518" y1="12" x2="518" y2="158" stroke="#c8ccd6" stroke-width="1" stroke-dasharray="2 3"/>
<text x="140" y="173" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">1 ns</text>
<text x="302" y="173" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">1 µs</text>
<text x="464" y="173" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">1 ms</text>
<text x="76" y="32" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="end">register</text>
<rect x="86" y="16" width="54" height="22" rx="3" fill="#dfe3ea" stroke="#9aa3b2" stroke-width="1.2"/>
<text x="148" y="32" font-size="15" font-weight="600" fill="#1a1c22" text-anchor="start">~1 ns</text>
<text x="76" y="67" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="end">RAM</text>
<rect x="86" y="51" width="162" height="22" rx="3" fill="#dfe3ea" stroke="#9aa3b2" stroke-width="1.2"/>
<text x="256" y="67" font-size="15" font-weight="600" fill="#1a1c22" text-anchor="start">~100 ns</text>
<text x="76" y="102" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="end">SSD</text>
<rect x="86" y="86" width="324" height="22" rx="3" fill="#fde7bf" stroke="#c98a1a" stroke-width="1.2"/>
<text x="418" y="102" font-size="15" font-weight="600" fill="#c0392b" text-anchor="start">~100 µs (~1,000 × RAM)</text>
<text x="76" y="137" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="end">disk</text>
<rect x="86" y="121" width="432" height="22" rx="3" fill="#fde7bf" stroke="#c98a1a" stroke-width="1.2"/>
<text x="526" y="137" font-size="15" font-weight="600" fill="#c0392b" text-anchor="start">~10 ms (~100,000 × RAM)</text>
</svg>
