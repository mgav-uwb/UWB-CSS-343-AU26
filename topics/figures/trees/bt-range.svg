<svg xmlns="http://www.w3.org/2000/svg" width="536" height="122" viewBox="0 0 536 122" role="img" font-family="system-ui, sans-serif" aria-label="A range query for 20 to 40 on the router node 30, 60 at the top; the router node 30, 60 has children the node 10, 20, the node 30, 45, the node 60, 90; the leaves are linked left to right, the last to nothing. One descent: 20 &lt; 30, to the leaf 10, 20, which holds 20. Then along the chain to the leaf 30, 45: 30 is in range, 45 is past 40, so the scan stops. Three node reads.">
