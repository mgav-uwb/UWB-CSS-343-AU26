<svg xmlns="http://www.w3.org/2000/svg" width="804" height="542" viewBox="0 0 804 542" role="img" font-family="system-ui, sans-serif" aria-label="Delete repairs under a 3-node parent, each case before and after its moves, the red-black BST beside its 2-3 tree; the dashed node is the empty node. In the 2-3 trees the key that comes down is shaded amber and the key that goes up green. empty left, middle sibling [40]: recolor 30 black, 40 red, rotateLeft(30) turn 60 at the root; 60 has left child 30 by a red link and right child 70 by a black link; 30 has left child an empty node (a missing black) by a black link and right child 40 by a black link into 60 at the root; 60 has left child 40 by a black link and right child 70 by a black link; 40 has left child 30 by a red link; as 2-3 trees, [30|60]([], [40], [70]) becomes [60]([30|40], [70]); done. empty middle, siblings [10] and [70]: recolor 30 black, 10 red turn 60 at the root; 60 has left child 30 by a red link and right child 70 by a black link; 30 has left child 10 by a black link and right child an empty node (a missing black) by a black link into 60 at the root; 60 has left child 30 by a black link and right child 70 by a black link; 30 has left child 10 by a red link; as 2-3 trees, [30|60]([10], [], [70]) becomes [60]([10|30], [70]); done. empty right, middle sibling [40]: rotateRight(60), recolor 60 black, 40 red turn 60 at the root; 60 has left child 30 by a red link and right child an empty node (a missing black) by a black link; 30 has left child 10 by a black link and right child 40 by a black link into 30 at the root; 30 has left child 10 by a black link and right child 60 by a black link; 60 has left child 40 by a red link; as 2-3 trees, [30|60]([10], [40], []) becomes [30]([10], [40|60]); done.">
