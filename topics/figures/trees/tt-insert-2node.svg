<svg xmlns="http://www.w3.org/2000/svg" width="424" height="89" viewBox="0 0 424 89" role="img" font-family="system-ui, sans-serif" aria-label="Inserting 15 into the 2-node leaf 10: it becomes the 3-node 10, 15, with no change in height.">
<rect width="424" height="89" fill="#fff"/>
<rect x="48.8" y="20.4" width="27.6" height="26" rx="6" fill="#fff"/>
<rect x="48.8" y="20.4" width="27.6" height="26" rx="6" fill="none" stroke="#2a2d36" stroke-width="1.6"/>
<text x="62.6" y="38.4" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">10</text>
<text x="62.6" y="72.4" font-size="13.2" font-weight="400" fill="#5c6270" text-anchor="middle">a 2-node leaf</text>
<text x="164.2" y="27.4" font-size="24" font-weight="400" fill="#5c6270" text-anchor="middle">→</text>
<text x="164.2" y="46.6" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">insert 15</text>
<rect x="285.8" y="20.4" width="55.1" height="26" rx="6" fill="#fff"/>
<rect x="313.4" y="20.4" width="27.6" height="26" fill="#fde7bf"/>
<line x1="313.4" y1="20.4" x2="313.4" y2="46.4" stroke="#c8ccd6" stroke-width="1"/>
<rect x="285.8" y="20.4" width="55.1" height="26" rx="6" fill="none" stroke="#2a2d36" stroke-width="1.6"/>
<text x="299.6" y="38.4" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">10</text>
<text x="327.1" y="38.4" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">15</text>
<text x="313.4" y="72.4" font-size="13.2" font-weight="400" fill="#5c6270" text-anchor="middle">a 3-node: no height change</text>
</svg>
