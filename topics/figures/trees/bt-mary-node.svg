<svg xmlns="http://www.w3.org/2000/svg" width="283" height="140" viewBox="0 0 283 140" role="img" font-family="system-ui, sans-serif" aria-label="An M-ary search tree node: a sorted array of keys k1, k2, up to k(M−1), and M children: keys less than k1, keys between k1 and k2, and so on, keys greater than k(M−1).">
<rect width="283" height="140" fill="#fff"/>
<line x1="66.6" y1="36" x2="34" y2="75" stroke="#4a5163" stroke-width="1.5"/>
<line x1="102.6" y1="36" x2="110.1" y2="75" stroke="#4a5163" stroke-width="1.5"/>
<line x1="156.6" y1="36" x2="177.1" y2="75" stroke="#4a5163" stroke-width="1.5"/>
<line x1="210.6" y1="36" x2="243.2" y2="75" stroke="#4a5163" stroke-width="1.5"/>
<rect x="66.6" y="10" width="144" height="26" rx="6" fill="#fff"/>
<line x1="102.6" y1="10" x2="102.6" y2="36" stroke="#c8ccd6" stroke-width="1"/>
<line x1="138.6" y1="10" x2="138.6" y2="36" stroke="#c8ccd6" stroke-width="1"/>
<line x1="174.6" y1="10" x2="174.6" y2="36" stroke="#c8ccd6" stroke-width="1"/>
<rect x="66.6" y="10" width="144" height="26" rx="6" fill="none" stroke="#2a2d36" stroke-width="1.6"/>
<text x="84.6" y="28" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">k<tspan dy="4" font-size="9.4">1</tspan></text>
<text x="120.6" y="28" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">k<tspan dy="4" font-size="9.4">2</tspan></text>
<text x="156.6" y="28" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">…</text>
<text x="192.6" y="28" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">k<tspan dy="4" font-size="9.4">M−1</tspan></text>
<path d="M34,75 L10,108 L58,108 Z" fill="#eef1f6" stroke="#9aa3b2" stroke-width="1.4"/>
<text x="34" y="102" font-size="15" font-weight="600" fill="#3a3f4a" text-anchor="middle">&lt; k<tspan dy="4" font-size="10.8">1</tspan></text>
<path d="M110.1,75 L80,108 L140.1,108 Z" fill="#eef1f6" stroke="#9aa3b2" stroke-width="1.4"/>
<text x="110.1" y="102" font-size="15" font-weight="600" fill="#3a3f4a" text-anchor="middle">k<tspan dy="4" font-size="10.8">1</tspan><tspan dy="-4">..k</tspan><tspan dy="4" font-size="10.8">2</tspan></text>
<path d="M177.1,75 L162.1,108 L192.1,108 Z" fill="#eef1f6" stroke="#9aa3b2" stroke-width="1.4"/>
<text x="177.1" y="102" font-size="15" font-weight="600" fill="#3a3f4a" text-anchor="middle">…</text>
<path d="M243.2,75 L214.1,108 L272.2,108 Z" fill="#eef1f6" stroke="#9aa3b2" stroke-width="1.4"/>
<text x="243.2" y="102" font-size="15" font-weight="600" fill="#3a3f4a" text-anchor="middle">&gt; k<tspan dy="4" font-size="10.8">M−1</tspan></text>
<text x="141.1" y="123.6" font-size="13.2" font-weight="400" fill="#5c6270" text-anchor="middle">M − 1 sorted keys, M children</text>
</svg>
