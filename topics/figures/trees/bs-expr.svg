<text x="161" y="100" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">4</text>
<text x="329" y="25.6" font-size="14.4" font-weight="600" fill="#2a2d36" text-anchor="middle">2 + (3 × 4) = 14</text>
