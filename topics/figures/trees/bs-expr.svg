<svg xmlns="http://www.w3.org/2000/svg" width="422" height="166" viewBox="0 0 422 166" role="img" font-family="system-ui, sans-serif" aria-label="Two expression trees. (2 + 3) × 4 = 20: the root is ×, its left child is + with leaves 2 and 3, its right child is the leaf 4. 2 + (3 × 4) = 14: the root is +, its left child is the leaf 2, its right child is × with leaves 3 and 4.">
