<svg xmlns="http://www.w3.org/2000/svg" width="794" height="438" viewBox="0 0 794 438" role="img" font-family="system-ui, sans-serif" aria-label="The five places a new red node can land, each as the tree before and after the new red node is attached, red-black BST above its 2-3 tree. into a 2-node, smaller: insert 30 into [50]. Before, 50 at the root; after, 50 at the root; 50 has left child 30 by a red link. The 2-3 node [50] becomes [30|50], a 3-node; no violation. into a 2-node, larger: insert 70 into [50]. Before, 50 at the root; after, 50 at the root; 50 has right child 70 by a red link. The 2-3 node [50] becomes [50|70], a 3-node; a red link leans right. into a 3-node, larger: insert 70 into [30|50]. Before, 50 at the root; 50 has left child 30 by a red link; after, 50 at the root; 50 has left child 30 by a red link and right child 70 by a red link. The 2-3 node [30|50] becomes [30|50|70], a 4-node; two red children. into a 3-node, smaller: insert 10 into [30|50]. Before, 50 at the root; 50 has left child 30 by a red link; after, 50 at the root; 50 has left child 30 by a red link; 30 has left child 10 by a red link. The 2-3 node [30|50] becomes [10|30|50], a 4-node; two reds in a row. into a 3-node, between: insert 40 into [30|50]. Before, 50 at the root; 50 has left child 30 by a red link; after, 50 at the root; 50 has left child 30 by a red link; 30 has right child 40 by a red link. The 2-3 node [30|50] becomes [30|40|50], a 4-node; two reds in a row, leaning right.">
