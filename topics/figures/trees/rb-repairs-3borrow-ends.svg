<svg xmlns="http://www.w3.org/2000/svg" width="872" height="446" viewBox="0 0 872 446" role="img" font-family="system-ui, sans-serif" aria-label="Delete repairs under a 3-node parent, each case before and after its moves, the red-black BST beside its 2-3 tree; the dashed node is the empty node. In the 2-3 trees the key that comes down is shaded amber and the key that goes up green. empty left, middle sibling [40|50]: rotateRight(50), rotateLeft(30), recolor 30, 50 black turn 60 at the root; 60 has left child 30 by a red link and right child 70 by a black link; 30 has left child an empty node (a missing black) by a black link and right child 50 by a black link; 50 has left child 40 by a red link into 60 at the root; 60 has left child 40 by a red link and right child 70 by a black link; 40 has left child 30 by a black link and right child 50 by a black link; as 2-3 trees, [30|60]([], [40|50], [70]) becomes [40|60]([30], [50], [70]); done. empty right, middle sibling [40|50]: rotateLeft(30), rotateRight(60), recolor 40, 60 black turn 60 at the root; 60 has left child 30 by a red link and right child an empty node (a missing black) by a black link; 30 has left child 10 by a black link and right child 50 by a black link; 50 has left child 40 by a red link into 50 at the root; 50 has left child 30 by a red link and right child 60 by a black link; 30 has left child 10 by a black link and right child 40 by a black link; as 2-3 trees, [30|60]([10], [40|50], []) becomes [30|50]([10], [40], [60]); done.">
