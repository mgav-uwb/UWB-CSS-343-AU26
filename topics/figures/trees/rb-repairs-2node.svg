<svg xmlns="http://www.w3.org/2000/svg" width="800" height="515" viewBox="0 0 800 515" role="img" font-family="system-ui, sans-serif" aria-label="Delete repairs under a 2-node parent, each case before and after its moves, the red-black BST above its 2-3 tree; the dashed node is the empty node. In the 2-3 trees the key that comes down is shaded amber and the key that goes up green. empty left, sibling [60|70]: borrow: rotateRight(70), rotateLeft(40), recolor 40, 70 black turn 40 at the root; 40 has left child an empty node (a missing black) by a black link and right child 70 by a black link; 70 has left child 60 by a red link into 60 at the root; 60 has left child 40 by a black link and right child 70 by a black link; as 2-3 trees, [40]([], [60|70]) becomes [60]([40], [70]); done. empty left, sibling [60]: merge: recolor 60 red, rotateLeft(40) turn 40 at the root; 40 has left child an empty node (a missing black) by a black link and right child 60 by a black link into an empty node (a missing black) at the root; an empty node (a missing black) has left child 60 by a black link; 60 has left child 40 by a red link; as 2-3 trees, [40]([], [60]) becomes []([40|60]); the empty node moves up. empty right, sibling [10|20]: borrow: rotateRight(40), recolor 10, 40 black turn 40 at the root; 40 has left child 20 by a black link and right child an empty node (a missing black) by a black link; 20 has left child 10 by a red link into 20 at the root; 20 has left child 10 by a black link and right child 40 by a black link; as 2-3 trees, [40]([10|20], []) becomes [20]([10], [40]); done. empty right, sibling [20]: merge: recolor 20 red turn 40 at the root; 40 has left child 20 by a black link and right child an empty node (a missing black) by a black link into an empty node (a missing black) at the root; an empty node (a missing black) has left child 40 by a black link; 40 has left child 20 by a red link; as 2-3 trees, [40]([20], []) becomes []([20|40]); the empty node moves up.">
