<svg xmlns="http://www.w3.org/2000/svg" width="500" height="132" viewBox="0 0 500 132" role="img" font-family="system-ui, sans-serif" aria-label="The two kinds of 2-3 node. A 2-node: the node b at the top; the node b has children subtree &lt; b, subtree &gt; b; keys less than b go left, greater than b go right. A 3-node: the node a, c at the top; the node a, c has children subtree &lt; a, subtree a..c, subtree &gt; c; keys less than a go left, between a and c to the middle, greater than c go right.">
<rect width="500" height="132" fill="#fff"/>
<line x1="93.5" y1="36" x2="78" y2="67" stroke="#4a5163" stroke-width="1.5"/>
<line x1="119.5" y1="36" x2="135" y2="67" stroke="#4a5163" stroke-width="1.5"/>
<rect x="93.5" y="10" width="26" height="26" rx="6" fill="#fff"/>
<rect x="93.5" y="10" width="26" height="26" rx="6" fill="none" stroke="#2a2d36" stroke-width="1.6"/>
<text x="106.5" y="28" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">b</text>
<path d="M78,67 L56.5,100 L99.5,100 Z" fill="#eef1f6" stroke="#9aa3b2" stroke-width="1.4"/>
<text x="78" y="94" font-size="15" font-weight="600" fill="#3a3f4a" text-anchor="middle">&lt; b</text>
<path d="M135,67 L113.5,100 L156.5,100 Z" fill="#eef1f6" stroke="#9aa3b2" stroke-width="1.4"/>
<text x="135" y="94" font-size="15" font-weight="600" fill="#3a3f4a" text-anchor="middle">&gt; b</text>
<text x="106.5" y="115.6" font-size="13.2" font-weight="400" fill="#5c6270" text-anchor="middle">2-node: 1 key, 2 children</text>

<line x1="363.2" y1="36" x2="328.7" y2="67" stroke="#4a5163" stroke-width="1.5"/>
<line x1="389.2" y1="36" x2="389.2" y2="67" stroke="#4a5163" stroke-width="1.5"/>
<line x1="415.2" y1="36" x2="449.7" y2="67" stroke="#4a5163" stroke-width="1.5"/>
<rect x="363.2" y="10" width="52" height="26" rx="6" fill="#fff"/>
<line x1="389.2" y1="10" x2="389.2" y2="36" stroke="#c8ccd6" stroke-width="1"/>
<rect x="363.2" y="10" width="52" height="26" rx="6" fill="none" stroke="#2a2d36" stroke-width="1.6"/>
<text x="376.2" y="28" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">a</text>
<text x="402.2" y="28" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">c</text>
<path d="M328.7,67 L307.2,100 L350.2,100 Z" fill="#eef1f6" stroke="#9aa3b2" stroke-width="1.4"/>
<text x="328.7" y="94" font-size="15" font-weight="600" fill="#3a3f4a" text-anchor="middle">&lt; a</text>
<path d="M389.2,67 L364.2,100 L414.2,100 Z" fill="#eef1f6" stroke="#9aa3b2" stroke-width="1.4"/>
<text x="389.2" y="94" font-size="15" font-weight="600" fill="#3a3f4a" text-anchor="middle">a..c</text>
<path d="M449.7,67 L428.2,100 L471.2,100 Z" fill="#eef1f6" stroke="#9aa3b2" stroke-width="1.4"/>
<text x="449.7" y="94" font-size="15" font-weight="600" fill="#3a3f4a" text-anchor="middle">&gt; c</text>
<text x="389.2" y="115.6" font-size="13.2" font-weight="400" fill="#5c6270" text-anchor="middle">3-node: 2 keys, 3 children</text>
</svg>
