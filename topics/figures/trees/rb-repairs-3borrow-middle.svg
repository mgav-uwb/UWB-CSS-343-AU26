<svg xmlns="http://www.w3.org/2000/svg" width="872" height="404" viewBox="0 0 872 404" role="img" font-family="system-ui, sans-serif" aria-label="Delete repairs under a 3-node parent, each case before and after its moves, the red-black BST beside its 2-3 tree; the dashed node is the empty node. In the 2-3 trees the key that comes down is shaded amber and the key that goes up green. empty middle, left sibling [10|20]: rotateRight(30), recolor 10, 30 black turn 60 at the root; 60 has left child 30 by a red link and right child 70 by a black link; 30 has left child 20 by a black link and right child an empty node (a missing black) by a black link; 20 has left child 10 by a red link into 60 at the root; 60 has left child 20 by a red link and right child 70 by a black link; 20 has left child 10 by a black link and right child 30 by a black link; as 2-3 trees, [30|60]([10|20], [], [70]) becomes [20|60]([10], [30], [70]); done. empty middle, left [10], right [70|80]: rotateRight(80), rotateLeft(60), rotateRight(60), recolor 60, 80 black turn 60 at the root; 60 has left child 30 by a red link and right child 80 by a black link; 30 has left child 10 by a black link and right child an empty node (a missing black) by a black link; 80 has left child 70 by a red link into 70 at the root; 70 has left child 30 by a red link and right child 80 by a black link; 30 has left child 10 by a black link and right child 60 by a black link; as 2-3 trees, [30|60]([10], [], [70|80]) becomes [30|70]([10], [60], [80]); done.">
