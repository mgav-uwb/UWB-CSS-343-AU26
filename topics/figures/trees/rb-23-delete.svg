<svg xmlns="http://www.w3.org/2000/svg" width="705" height="287" viewBox="0 0 705 287" role="img" font-family="system-ui, sans-serif" aria-label="What the 2-3 delete does with an empty node (dashed), each case before and after; the key that comes down is shaded amber, the key that goes up green. a sibling is a 3-node: borrow: borrow: 40 down, 60 up, 2-3 view: the node holding 40 at the top; the node holding 40 has children, left to right, an empty node, the node holding 60 and 70 becomes 2-3 view: the node holding 60 at the top; the node holding 60 has children, left to right, the node holding 40, the node holding 70; done. 3-node parent, 2-node siblings: merge: merge: 30 down into [40], 2-3 view: the node holding 30 and 60 at the top; the node holding 30 and 60 has children, left to right, an empty node, the node holding 40, the node holding 70 becomes 2-3 view: the node holding 60 at the top; the node holding 60 has children, left to right, the node holding 30 and 40, the node holding 70; done: the parent keeps 60. 2-node parent, 2-node sibling: merge: merge: 40 down into [60], 2-3 view: the node holding 40 at the top; the node holding 40 has children, left to right, an empty node, the node holding 60 becomes 2-3 view: an empty node at the top; an empty node has children, left to right, the node holding 40 and 60; the empty node moves up. the empty node is the root: drop it, 2-3 view: an empty node at the top; an empty node has children, left to right, the node holding 40 and 60 becomes 2-3 view: the node holding 40 and 60 at the top; done: one level shorter.">
