<rect x="51.6" y="64" width="27.6" height="26" rx="6" fill="none" stroke="#2a2d36" stroke-width="1.6"/>
<text x="65.3" y="82" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">30</text>
