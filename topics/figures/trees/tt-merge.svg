<rect x="93.1" y="64" width="27.6" height="26" rx="6" fill="none" stroke="#2a2d36" stroke-width="1.6"/>
<text x="106.9" y="82" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">60</text>
<text x="65.3" y="105.6" font-size="13.2" font-weight="400" fill="#5c6270" text-anchor="middle">delete 10</text>
<text x="169.7" y="44" font-size="24" font-weight="400" fill="#5c6270" text-anchor="middle">→</text>
<text x="169.7" y="63.2" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">remove 10</text>
<line x1="309.6" y1="36" x2="295.6" y2="64" stroke="#4a5163" stroke-width="1.5"/>
<line x1="337.2" y1="36" x2="337.2" y2="64" stroke="#4a5163" stroke-width="1.5"/>
<line x1="364.7" y1="36" x2="378.7" y2="64" stroke="#4a5163" stroke-width="1.5"/>
