<svg xmlns="http://www.w3.org/2000/svg" width="774" height="122" viewBox="0 0 774 122" role="img" font-family="system-ui, sans-serif" aria-label="Merging. the node 20, 50 at the top; the node 20, 50 has children the node 10, the node 30, the node 60; deleting 10 empties its leaf, and its sibling 30 has only one key. The parent's 20 comes down and joins 30, giving the node 50 at the top; the node 50 has children the node 20, 30, the node 60. The parent lost a key; had it been a 2-node, it would be empty and the repair would repeat one level up.">
