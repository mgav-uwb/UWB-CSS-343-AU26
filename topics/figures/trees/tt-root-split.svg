<svg xmlns="http://www.w3.org/2000/svg" width="647" height="186" viewBox="0 0 647 186" role="img" font-family="system-ui, sans-serif" aria-label="The root splits. Before: the node p, m, q (overflowing) at the top; the node p, m, q (overflowing) has children subtree A, subtree B, subtree C, subtree D. After: the node m at the top; the node m has children the node p, the node q; the node p has children subtree A, subtree B; the node q has children subtree C, subtree D: m is a new root, so every leaf is one level deeper and all are still at the same depth.">
