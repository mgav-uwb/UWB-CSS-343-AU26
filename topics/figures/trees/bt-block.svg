<svg xmlns="http://www.w3.org/2000/svg" width="562" height="124" viewBox="0 0 562 124" role="img" font-family="system-ui, sans-serif" aria-label="One 4,096-byte block holding a B-tree node: pointers p0 to p255 alternating with keys k1 to k255. 256 pointers of 8 bytes and 255 keys of 8 bytes take 4088 bytes, which fits; order 257 would need 4104 bytes. So M = 256.">
<rect width="562" height="124" fill="#fff"/>
<text x="20" y="22" font-size="14.4" font-weight="600" fill="#2a2d36" text-anchor="start">one block: 4,096 bytes</text>
<rect x="20" y="30" width="64" height="30" fill="#e7eefc" stroke="#2a2d36" stroke-width="1.2"/>
<text x="52" y="50" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">p<tspan dy="4" font-size="9.4">0</tspan></text>
<rect x="84" y="30" width="64" height="30" fill="#fde7bf" stroke="#2a2d36" stroke-width="1.2"/>
<text x="116" y="50" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">k<tspan dy="4" font-size="9.4">1</tspan></text>
<rect x="148" y="30" width="64" height="30" fill="#e7eefc" stroke="#2a2d36" stroke-width="1.2"/>
<text x="180" y="50" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">p<tspan dy="4" font-size="9.4">1</tspan></text>
<rect x="212" y="30" width="64" height="30" fill="#fde7bf" stroke="#2a2d36" stroke-width="1.2"/>
<text x="244" y="50" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">k<tspan dy="4" font-size="9.4">2</tspan></text>
<rect x="276" y="30" width="64" height="30" fill="#e7eefc" stroke="#2a2d36" stroke-width="1.2"/>
<text x="308" y="50" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">p<tspan dy="4" font-size="9.4">2</tspan></text>
<rect x="340" y="30" width="64" height="30" fill="#fff" stroke="#2a2d36" stroke-width="1.2"/>
<text x="372" y="50" font-size="13" font-weight="600" fill="#5c6270" text-anchor="middle">…</text>
<rect x="404" y="30" width="64" height="30" fill="#fde7bf" stroke="#2a2d36" stroke-width="1.2"/>
<text x="436" y="50" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">k<tspan dy="4" font-size="9.4">255</tspan></text>
<rect x="468" y="30" width="64" height="30" fill="#e7eefc" stroke="#2a2d36" stroke-width="1.2"/>
<text x="500" y="50" font-size="13" font-weight="600" fill="#1a1c22" text-anchor="middle">p<tspan dy="4" font-size="9.4">255</tspan></text>
<text x="20" y="80" font-size="15" font-weight="600" fill="#1a1c22" text-anchor="start">256 pointers × 8 B + 255 keys × 8 B = 4,088 B ≤ 4,096 B</text>
<text x="20" y="100" font-size="14.4" font-weight="400" fill="#5c6270" text-anchor="start">so M = 256: one more pointer and key would need 4,104 B</text>
</svg>
