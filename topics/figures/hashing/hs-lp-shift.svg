<svg xmlns="http://www.w3.org/2000/svg" width="755" height="478" viewBox="0 0 755 478" role="img" font-family="system-ui, sans-serif" aria-label="Delete 31 by shifting from the cluster across the end of the array (M = 11). A key with home r in slot j moves back into the hole i only if the hole is on its probe path: d(r, i) &lt; d(r, j), where d(a, b) = (b − a) mod 11 counts the steps forward from a to b. start: M = 11: 11 at 0, 53 at 1, 31 at 9, 42 at 10; the rest empty (one cluster: slots 9, 10, 0, 1). delete 31: M = 11: 11 at 0, 53 at 1, 42 at 10; the rest empty (empty slot 9: the hole). 42 in slot 10 home 9: M = 11: 11 at 0, 53 at 1, 42 at 9; the rest empty (d(9, 9) = 0 &lt; d(9, 10) = 1: on its path: move it to slot 9). 11 in slot 0 home 0: M = 11: 11 at 0, 53 at 1, 42 at 9; the rest empty (d(0, 10) = 10 ≥ d(0, 0) = 0: not on its path: it stays). 53 in slot 1 home 9: M = 11: 11 at 0, 42 at 9, 53 at 10; the rest empty (d(9, 10) = 1 &lt; d(9, 1) = 3: on its path: move it to slot 10). end: M = 11: 11 at 0, 42 at 9, 53 at 10; the rest empty (slot 2 is empty: the cluster ends every key is on its probe path).">
