<svg xmlns="http://www.w3.org/2000/svg" width="865" height="314" viewBox="0 0 865 314" role="img" font-family="system-ui, sans-serif" aria-label="The same delete with the wrong test: move a key back when its home slot number is at most the hole's (r ≤ i). The cluster runs across the end of the array, so slot numbers do not follow the probe path. start: M = 11: 11 at 0, 53 at 1, 31 at 9, 42 at 10; the rest empty (one cluster: slots 9, 10, 0, 1). delete 31, move when home ≤ hole: M = 11: 53 at 1, 42 at 9, 11 at 10; the rest empty (11: home 0 ≤ hole 10, so it moved to slot 10, a slot its search never reaches ✗). search 11: M = 11: 53 at 1, 42 at 9, 11 at 10; the rest empty (h(11) = 0 is empty: not found ✗ 11 is in slot 10). search 53: M = 11: 53 at 1, 42 at 9, 11 at 10; the rest empty (42, 11, then empty slot 0: not found ✗ 53 is in slot 1).">
