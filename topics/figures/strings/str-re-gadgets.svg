<svg xmlns="http://www.w3.org/2000/svg" width="560" height="540" viewBox="0 0 560 540" role="img" font-family="system-ui, sans-serif" aria-label="Three wrapped regexes, each isolating one gadget, with the start closure drawn purple. Concatenation (ABC): epsilon-edges 0 to 1 and 4 to 5, match edges 1 to 2 on A, 2 to 3 on B, 3 to 4 on C; start closure {0, 1}. Union (A|B): epsilon-edges 0 to 1, 0 to 3 (the fork), 2 to 4 (the join), 4 to 5; match edges 1 to 2 on A and 3 to 4 on B; start closure {0, 1, 3}. Closure (A*): epsilon-edges 0 to 1, 1 to 2 (skip), 2 to 1 (repeat), 2 to 3, 3 to 4; match edge 1 to 2 on A; start closure {0, 1, 2, 3, 4}, which holds the accept state. .">
