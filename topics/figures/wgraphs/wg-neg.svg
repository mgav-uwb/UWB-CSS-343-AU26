<svg xmlns="http://www.w3.org/2000/svg" width="576" height="174" viewBox="0 0 576 174" role="img" font-family="system-ui, sans-serif" aria-label="s to a (1), s to b (2), b to a (minus 4). Dijkstra settles a at distance 1 before b; when b settles at 2, the edge b to a offers 2 + (minus 4) = minus 2, but a is already settled, so Dijkstra reports 1. The true shortest path is s to b to a, cost minus 2.">
