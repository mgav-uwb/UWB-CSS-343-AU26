<svg xmlns="http://www.w3.org/2000/svg" width="872" height="274" viewBox="0 0 872 274" role="img" font-family="system-ui, sans-serif" aria-label="The exchange on the cut S = {0, 1, 2}, whose lightest crossing edge is e = 1-3 (5). Left: a spanning tree T that leaves e out and uses 0-5 (20) instead, weight 46. Middle: adding e closes the cycle 1-0-5-4-3-1; the cycle crosses the cut twice, at e and at f = 0-5. Right: T minus f plus e is still a spanning tree, of weight 46 - 20 + 5 = 31, the minimum.">
