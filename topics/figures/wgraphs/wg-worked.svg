<svg xmlns="http://www.w3.org/2000/svg" width="608" height="410" viewBox="0 0 608 410" role="img" font-family="system-ui, sans-serif" aria-label="Dijkstra with a binary heap on 0 to 1 (2), 0 to 2 (5), 1 to 2 (1), 1 to 3 (7), 2 to 3 (3), from 0. Entries are (dist, vertex). pop (0,0): settle 0: queue empty; relax 0→1: dist[1] = 2: queue (2,1); relax 0→2: dist[2] = 5: queue (2,1) (5,2); pop (2,1): settle 1: queue (5,2); relax 1→2: 2 + 1 = 3 &lt; 5: queue (3,2) (5,2) stale; relax 1→3: dist[3] = 9: queue (3,2) (5,2) stale (9,3); pop (3,2): settle 2: queue (5,2) stale (9,3); relax 2→3: 3 + 3 = 6 &lt; 9: queue (5,2) stale (6,3) (9,3) stale; pop (5,2): 2 settled, skip: queue (6,3) (9,3) stale; pop (6,3): settle 3: queue (9,3) stale; pop (9,3): 3 settled, skip: queue empty. Final distances 0, 2, 3, 6; settle order 0, 1, 2, 3.">
