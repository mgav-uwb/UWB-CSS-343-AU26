<svg xmlns="http://www.w3.org/2000/svg" width="503" height="152" viewBox="0 0 503 152" role="img" font-family="system-ui, sans-serif" aria-label="The coin table for coins 1, 3, 4: best[n] for n = 0 to 6 is 0, 1, 2, 1, 1, 2, 2. best[6] looks back at best[5], best[3] and best[2] (last coin 1, 3 or 4); best[3] = 1 is the smallest, so best[6] = 2: 3 + 3.">
<rect width="503" height="152" fill="#fff"/>
<path d="M385.6,78 Q366.6,34 347.6,71" fill="none" stroke="#5c6270" stroke-width="1.6"/><path d="M347.6,78 L344,70.8 L351.2,70.8 Z" fill="#5c6270"/><text x="340.6" y="70" font-size="13.2" font-weight="700" fill="#5c6270" text-anchor="end">−1</text>
<path d="M385.6,78 Q328.6,-14 271.6,71" fill="none" stroke="#0a7d4d" stroke-width="1.6"/><path d="M271.6,78 L268,70.8 L275.2,70.8 Z" fill="#0a7d4d"/><text x="264.6" y="70" font-size="13.2" font-weight="700" fill="#0a7d4d" text-anchor="end">−3</text>
<path d="M385.6,78 Q309.6,-38 233.6,71" fill="none" stroke="#5c6270" stroke-width="1.6"/><path d="M233.6,78 L230,70.8 L237.2,70.8 Z" fill="#5c6270"/><text x="226.6" y="70" font-size="13.2" font-weight="700" fill="#5c6270" text-anchor="end">−4</text>
<text x="128.6" y="97" font-size="13.8" font-weight="600" fill="#2a2d36" text-anchor="end">best</text>
<rect x="138.6" y="80" width="38" height="26" fill="#fff" stroke="#2a2d36" stroke-width="1.2"/>
<text x="157.6" y="98" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">0</text>
<text x="157.6" y="119.2" font-size="12" font-weight="400" fill="#5c6270" text-anchor="middle">n = 0</text>
<rect x="176.6" y="80" width="38" height="26" fill="#fff" stroke="#2a2d36" stroke-width="1.2"/>
<text x="195.6" y="98" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">1</text>
<text x="195.6" y="119.2" font-size="12" font-weight="400" fill="#5c6270" text-anchor="middle">n = 1</text>
<rect x="214.6" y="80" width="38" height="26" fill="#fde7bf" stroke="#c98a1a" stroke-width="2"/>
<text x="233.6" y="98" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">2</text>
<text x="233.6" y="119.2" font-size="12" font-weight="400" fill="#5c6270" text-anchor="middle">n = 2</text>
<rect x="252.6" y="80" width="38" height="26" fill="#eaf6ef" stroke="#0a7d4d" stroke-width="2"/>
<text x="271.6" y="98" font-size="13.5" font-weight="600" fill="#0a7d4d" text-anchor="middle">1</text>
<text x="271.6" y="119.2" font-size="12" font-weight="400" fill="#5c6270" text-anchor="middle">n = 3</text>
<rect x="290.6" y="80" width="38" height="26" fill="#fff" stroke="#2a2d36" stroke-width="1.2"/>
<text x="309.6" y="98" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">1</text>
<text x="309.6" y="119.2" font-size="12" font-weight="400" fill="#5c6270" text-anchor="middle">n = 4</text>
<rect x="328.6" y="80" width="38" height="26" fill="#fde7bf" stroke="#c98a1a" stroke-width="2"/>
<text x="347.6" y="98" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">2</text>
<text x="347.6" y="119.2" font-size="12" font-weight="400" fill="#5c6270" text-anchor="middle">n = 5</text>
<rect x="366.6" y="80" width="38" height="26" fill="#efeaff" stroke="#7c5cff" stroke-width="2"/>
<text x="385.6" y="98" font-size="13.5" font-weight="600" fill="#7c5cff" text-anchor="middle">2</text>
<text x="385.6" y="119.2" font-size="12" font-weight="400" fill="#5c6270" text-anchor="middle">n = 6</text>
<text x="251.2" y="138.4" font-size="13.8" font-weight="600" fill="#2a2d36" text-anchor="middle">best[6] = 1 + min(best[5], best[3], best[2]) = 1 + min(2, 1, 2) = 2</text>
