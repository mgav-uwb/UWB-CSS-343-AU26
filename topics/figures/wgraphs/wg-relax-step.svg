<svg xmlns="http://www.w3.org/2000/svg" width="496" height="134" viewBox="0 0 496 134" role="img" font-family="system-ui, sans-serif" aria-label="Relaxing the edge u to v, weight 4, with dist[u] = 3 and dist[v] = 10: 3 + 4 = 7 &lt; 10, so dist[v] becomes 7 and parent[v] = u.">
<rect width="496" height="134" fill="#fff"/>
<text x="95" y="25.6" font-size="14.4" font-weight="600" fill="#2a2d36" text-anchor="middle">before</text>
