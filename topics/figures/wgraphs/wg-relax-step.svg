<path d="M141,69 L132,73.5 L132,64.5 Z" fill="#8a93a6"/>
<circle cx="95" cy="69" r="9.5" fill="#fff" stroke="#9aa3b5" stroke-width="1.1"/>
<text x="95" y="73" font-size="11.5" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#1a1c22" text-anchor="middle">4</text>
<circle cx="33" cy="69" r="15" fill="#fff" stroke="#5c6270" stroke-width="1.6"/>
<text x="33" y="73.8" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">u</text>
<circle cx="157" cy="69" r="15" fill="#fff" stroke="#5c6270" stroke-width="1.6"/>
<text x="157" y="73.8" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">v</text>
<rect x="22" y="35" width="22" height="19" rx="9.5" fill="#fff" stroke="#c9bfff" stroke-width="1.3"/>
<text x="33" y="49" font-size="12.5" font-weight="700" fill="#7c5cff" text-anchor="middle">3</text>
<rect x="143" y="35" width="28" height="19" rx="9.5" fill="#fff" stroke="#c9bfff" stroke-width="1.3"/>
<text x="157" y="49" font-size="12.5" font-weight="700" fill="#7c5cff" text-anchor="middle">10</text>
<text x="95" y="119.6" font-size="13.8" font-weight="600" fill="#5c6270" text-anchor="middle">parent[v] unset</text>
<text x="248" y="60.6" font-size="24" font-weight="400" fill="#5c6270" text-anchor="middle">→</text>
<text x="248" y="79.8" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">3 + 4 = 7 &lt; 10</text>
<text x="248" y="95.4" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">relax</text>
<text x="401" y="25.6" font-size="14.4" font-weight="600" fill="#2a2d36" text-anchor="middle">after</text>
<line x1="354" y1="69" x2="440" y2="69" stroke="#7c5cff" stroke-width="3.4"/>
<path d="M447,69 L435.8,74.6 L435.8,63.4 Z" fill="#7c5cff"/>
<circle cx="401" cy="69" r="9.5" fill="#fff" stroke="#9aa3b5" stroke-width="1.1"/>
<text x="401" y="73" font-size="11.5" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#1a1c22" text-anchor="middle">4</text>
<circle cx="339" cy="69" r="15" fill="#fff" stroke="#5c6270" stroke-width="1.6"/>
<text x="339" y="73.8" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">u</text>
<circle cx="463" cy="69" r="15" fill="#fff" stroke="#5c6270" stroke-width="1.6"/>
<text x="463" y="73.8" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">v</text>
<rect x="328" y="35" width="22" height="19" rx="9.5" fill="#fff" stroke="#c9bfff" stroke-width="1.3"/>
<text x="339" y="49" font-size="12.5" font-weight="700" fill="#7c5cff" text-anchor="middle">3</text>
<rect x="452" y="35" width="22" height="19" rx="9.5" fill="#fff" stroke="#c9bfff" stroke-width="1.3"/>
<text x="463" y="49" font-size="12.5" font-weight="700" fill="#7c5cff" text-anchor="middle">7</text>
<text x="401" y="119.6" font-size="13.8" font-weight="600" fill="#7c5cff" text-anchor="middle">parent[v] = u</text>
</svg>
