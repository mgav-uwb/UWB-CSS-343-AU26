<svg xmlns="http://www.w3.org/2000/svg" width="862" height="182" viewBox="0 0 862 182" role="img" font-family="system-ui, sans-serif" aria-label="The sink lemma. Before: key x at node k over two subtrees that are heaps; only x may be out of order. After one swap: the larger child c is on top, the sibling's heap is untouched, and x sits over two heaps one level down, the same picture. Repeating until x is at least both children, or a leaf, leaves one heap rooted at k.">
<rect width="862" height="182" fill="#fff"/>
<line x1="95" y1="32" x2="53" y2="78" stroke="#4a5163" stroke-width="1.6"/>
<line x1="95" y1="32" x2="137" y2="78" stroke="#4a5163" stroke-width="1.6"/>
<circle cx="95" cy="32" r="21" fill="#fde7bf"/><circle cx="95" cy="32" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/><text x="95" y="37" font-size="14" font-weight="600" font-style="italic" fill="#1a1c22" text-anchor="middle">x</text>
<path d="M53,72 L17,138 L89,138 Z" fill="#eaf6ef" stroke="#0a7d4d" stroke-width="1.4"/><text x="53" y="123.5" font-size="14.4" font-weight="600" fill="#0a7d4d" text-anchor="middle">heap</text>
<path d="M137,72 L101,138 L173,138 Z" fill="#eaf6ef" stroke="#0a7d4d" stroke-width="1.4"/><text x="137" y="123.5" font-size="14.4" font-weight="600" fill="#0a7d4d" text-anchor="middle">heap</text>
<text x="95" y="165.6" font-size="13.2" font-weight="400" fill="#5c6270" text-anchor="middle">only x may be out of order</text>
<text x="244.1" y="74" font-size="24" font-weight="400" fill="#5c6270" text-anchor="middle">→</text>
<text x="244.1" y="93.2" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">c: the larger</text>
<text x="244.1" y="108.8" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">child; swap</text>
<line x1="378.3" y1="27" x2="334.3" y2="73" stroke="#4a5163" stroke-width="1.6"/>
<line x1="378.3" y1="27" x2="452.3" y2="73" stroke="#4a5163" stroke-width="1.6"/>
<circle cx="378.3" cy="27" r="15" fill="#eaf6ef" stroke="#0a7d4d" stroke-width="1.6"/><text x="378.3" y="32" font-size="14" font-weight="600" font-style="italic" fill="#1a1c22" text-anchor="middle">c</text>
<path d="M334.3,67 L298.3,133 L370.3,133 Z" fill="#eaf6ef" stroke="#0a7d4d" stroke-width="1.4"/><text x="334.3" y="118.5" font-size="14.4" font-weight="600" fill="#0a7d4d" text-anchor="middle">heap</text>
<line x1="452.3" y1="73" x2="422.3" y2="109" stroke="#4a5163" stroke-width="1.6"/>
<line x1="452.3" y1="73" x2="482.3" y2="109" stroke="#4a5163" stroke-width="1.6"/>
<circle cx="452.3" cy="73" r="21" fill="#fde7bf"/><circle cx="452.3" cy="73" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/><text x="452.3" y="78" font-size="14" font-weight="600" font-style="italic" fill="#1a1c22" text-anchor="middle">x</text>
<path d="M422.3,103 L395.3,151 L449.3,151 Z" fill="#eaf6ef" stroke="#0a7d4d" stroke-width="1.4"/><text x="422.3" y="140.4" font-size="12.6" font-weight="600" fill="#0a7d4d" text-anchor="middle">heap</text>
<path d="M482.3,103 L455.3,151 L509.3,151 Z" fill="#eaf6ef" stroke="#0a7d4d" stroke-width="1.4"/><text x="482.3" y="140.4" font-size="12.6" font-weight="600" fill="#0a7d4d" text-anchor="middle">heap</text>
<text x="418.3" y="165.6" font-size="13.2" font-weight="400" fill="#5c6270" text-anchor="middle">the same picture, one level down</text>
<text x="615.1" y="74" font-size="24" font-weight="400" fill="#5c6270" text-anchor="middle">→</text>
<text x="615.1" y="93.2" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">until x ≥ its</text>
<text x="615.1" y="108.8" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">children, or a leaf</text>
<path d="M776.9,21 L706.9,133 L846.9,133 Z" fill="#eaf6ef" stroke="#0a7d4d" stroke-width="1.4"/><text x="776.9" y="108.4" font-size="14.4" font-weight="600" fill="#0a7d4d" text-anchor="middle">a heap</text>
<text x="776.9" y="165.6" font-size="13.2" font-weight="400" fill="#5c6270" text-anchor="middle">rooted at k</text>
</svg>
