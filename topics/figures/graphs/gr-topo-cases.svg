<text x="585.1" y="79" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">u finishes</text>
<text x="585.1" y="94.6" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">later</text>
<line x1="675.9" y1="65.8" x2="711.9" y2="65.8" stroke="#8a93a6" stroke-width="1.6"/>
