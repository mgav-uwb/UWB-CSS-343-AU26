<path d="M493.3,65.8 L484.3,70.3 L484.3,61.3 Z" fill="#8a93a6"/>
<circle cx="435.3" cy="65.8" r="15" fill="#eef0f3" stroke="#8a93a6" stroke-width="1.8"/>
<text x="435.3" y="70.6" font-size="13.5" font-weight="600" fill="#8a93a6" text-anchor="middle">u</text>
<circle cx="509.3" cy="65.8" r="15" fill="#2a2f3a" stroke="#2a2f3a" stroke-width="2.4"/>
<text x="509.3" y="70.6" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">v</text>
