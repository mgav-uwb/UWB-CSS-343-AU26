<text x="194.1" y="59.8" font-size="24" font-weight="400" fill="#5c6270" text-anchor="middle">→</text>
<text x="194.1" y="79" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">dfs(v) runs</text>
<text x="194.1" y="94.6" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">inside dfs(u)</text>
