<svg xmlns="http://www.w3.org/2000/svg" width="768" height="262" viewBox="0 0 768 262" role="img" font-family="system-ui, sans-serif" aria-label="When dfs(u) examines u → v: if v is white, dfs(v) runs inside dfs(u) and v finishes first; if v is black, v already finished; if v is gray, v is an ancestor, so a path v ⇝ u exists and u → v closes a cycle, impossible in a DAG.">
