<text x="281.3" y="70.6" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">u</text>
<circle cx="355.3" cy="65.8" r="15" fill="#2a2f3a" stroke="#2a2f3a" stroke-width="2.4"/>
<text x="355.3" y="70.6" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">v</text>
