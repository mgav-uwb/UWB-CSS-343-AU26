<svg xmlns="http://www.w3.org/2000/svg" width="573" height="167" viewBox="0 0 573 167" role="img" font-family="system-ui, sans-serif" aria-label="The call stack of factorial(4) at its deepest point: four frames, opened from top to bottom; every multiplication happens on the way back up. factorial(4) returns 4 × 6 = 24, factorial(3) returns 3 × 2 = 6, factorial(2) returns 2 × 1 = 2, factorial(1) (the base case) returns 1.">
<rect width="573" height="167" fill="#fff"/>
<line x1="22" y1="16" x2="22" y2="148" stroke="#c98a1a" stroke-width="1.8"/>
<path d="M22,155 L26,148 L18,148 Z" fill="#c98a1a"/>
<text x="17" y="85.5" font-size="13.8" fill="#c98a1a" font-weight="600" text-anchor="middle" transform="rotate(-90 17 85.5)">calls</text>
<line x1="550.9" y1="155" x2="550.9" y2="23" stroke="#0a7d4d" stroke-width="1.8"/>
<path d="M550.9,16 L554.9,23 L546.9,23 Z" fill="#0a7d4d"/>
<text x="555.9" y="85.5" font-size="13.8" fill="#0a7d4d" font-weight="600" text-anchor="middle" transform="rotate(90 555.9 85.5)">returns</text>
<rect x="44" y="10" width="253.7" height="30" rx="6" fill="#fff" stroke="#2a2d36" stroke-width="1.5"/>
<text x="54" y="30" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">factorial(4)</text>
<text x="287.7" y="29.5" font-size="14.4" font-weight="400" fill="#5c6270" text-anchor="end">n = 4</text>
<text x="377.7" y="29.5" font-size="14.4" font-weight="600" fill="#0a7d4d" text-anchor="start">returns 4 × 6 = 24</text>
<rect x="66" y="49" width="253.7" height="30" rx="6" fill="#fff" stroke="#2a2d36" stroke-width="1.5"/>
<text x="76" y="69" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">factorial(3)</text>
<text x="309.7" y="68.5" font-size="14.4" font-weight="400" fill="#5c6270" text-anchor="end">n = 3</text>
<text x="377.7" y="68.5" font-size="14.4" font-weight="600" fill="#0a7d4d" text-anchor="start">returns 3 × 2 = 6</text>
<rect x="88" y="88" width="253.7" height="30" rx="6" fill="#fff" stroke="#2a2d36" stroke-width="1.5"/>
<text x="98" y="108" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">factorial(2)</text>
<text x="331.7" y="107.5" font-size="14.4" font-weight="400" fill="#5c6270" text-anchor="end">n = 2</text>
<text x="377.7" y="107.5" font-size="14.4" font-weight="600" fill="#0a7d4d" text-anchor="start">returns 2 × 1 = 2</text>
<rect x="110" y="127" width="253.7" height="30" rx="6" fill="#eaf6ef" stroke="#0a7d4d" stroke-width="1.5"/>
<text x="120" y="147" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">factorial(1)</text>
<text x="353.7" y="146.5" font-size="14.4" font-weight="600" fill="#0a7d4d" text-anchor="end">n = 1: base case</text>
<text x="377.7" y="146.5" font-size="14.4" font-weight="600" fill="#0a7d4d" text-anchor="start">returns 1</text>
</svg>
