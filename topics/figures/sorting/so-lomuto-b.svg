<svg xmlns="http://www.w3.org/2000/svg" width="694" height="326" viewBox="0 0 694 326" role="img" font-family="system-ui, sans-serif" aria-label="Lomuto partition of 3 7 1 9 4 8 6 2 5 around the last element, 5, rows 7 to 10 of 10. Green: keys smaller than the pivot, a[lo..i]; blue: keys scanned and not smaller; amber: the pivot; the ringed cell is a[j]. j = 5 8 &lt; 5? no: [3 1 4 9 7 8 6 2 5] (i at 2, j at 5) (skip). j = 6 6 &lt; 5? no: [3 1 4 9 7 8 6 2 5] (i at 2, j at 6) (skip). j = 7 2 &lt; 5: take: [3 1 4 2 7 8 6 9 5] (i at 3, j at 7) (i = 3: swap a[3] and a[7]). place swap(a[i+1], a[hi]): [3 1 4 2 5 8 6 9 7] (p at 4) (p = 4: the pivot is home;; left of it &lt; 5, right of it &gt; 5).">
