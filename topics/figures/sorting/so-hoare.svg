<svg xmlns="http://www.w3.org/2000/svg" width="761" height="377" viewBox="0 0 761 377" role="img" font-family="system-ui, sans-serif" aria-label="Hoare partition of 3 7 1 9 4 8 6 2 5 around the first element, 3. i walks right past keys smaller than the pivot (green), j walks left past keys larger (blue); when both stop on keys that are on the wrong sides, one swap fixes both. start: [3 7 1 9 4 8 6 2 5] (pivot = a[lo] = 3). scan i = 1 &lt; j = 7: [3 7 1 9 4 8 6 2 5] (i at 1, j at 7) (i stops at 7 (≥ 3); j passes 5, stops at 2 (≤ 3)). swap a[1] and a[7]: [3 2 1 9 4 8 6 7 5] (i at 1, j at 7) (each moves to the side it belongs on). scan i = 3 ≥ j = 2: crossed: [3 2 1 9 4 8 6 7 5] (i at 3, j at 2) (i passes 1, stops at 9 (≥ 3); j passes 6, 8, 4, 9, stops at 1 (≤ 3)). place swap(a[lo], a[j]): [1 2 3 9 4 8 6 7 5] (p at 2) (the pivot is home at index 2).">
