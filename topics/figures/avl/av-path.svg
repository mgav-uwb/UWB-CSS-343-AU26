<svg xmlns="http://www.w3.org/2000/svg" width="210" height="190" viewBox="0 0 210 190" role="img" font-family="system-ui, sans-serif" aria-label="The keys 1, 2, 3, 4, 5 inserted in order into a plain binary search tree: 1 at the root; 1 has right child 2; 2 has right child 3; 3 has right child 4; 4 has right child 5. each key is the right child of the one before, a path of height n − 1 = 4.">
<rect width="210" height="190" fill="#fff"/>
<line x1="25" y1="25" x2="65" y2="55" stroke="#4a5163" stroke-width="1.6"/>
<line x1="65" y1="55" x2="105" y2="85" stroke="#4a5163" stroke-width="1.6"/>
<line x1="105" y1="85" x2="145" y2="115" stroke="#4a5163" stroke-width="1.6"/>
<line x1="145" y1="115" x2="185" y2="145" stroke="#4a5163" stroke-width="1.6"/>
<circle cx="25" cy="25" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
<text x="25" y="30" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">1</text>
<circle cx="65" cy="55" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
<text x="65" y="60" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">2</text>
<circle cx="105" cy="85" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
<text x="105" y="90" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">3</text>
<circle cx="145" cy="115" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
<text x="145" y="120" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">4</text>
<circle cx="185" cy="145" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
<text x="185" y="150" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">5</text>
<text x="105" y="175.6" font-size="13.8" font-weight="600" fill="#5c6270" text-anchor="middle">height = n − 1 = 4</text>
</svg>
