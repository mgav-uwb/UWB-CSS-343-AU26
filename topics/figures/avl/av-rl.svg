<svg xmlns="http://www.w3.org/2000/svg" width="684" height="178" viewBox="0 0 684 178" role="img" font-family="system-ui, sans-serif" aria-label="Insert 2 into the AVL tree 1(·, 3). The plain insert gives the kinked tree 1(·, 3(2, ·)); rotateRight(3) straightens it into 1(·, 2(·, 3)), and rotateLeft(1) gives 2(1, 3), every balance factor 0.">
