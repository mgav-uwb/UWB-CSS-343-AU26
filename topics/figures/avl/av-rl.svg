<text x="334.3" y="86" font-size="13.5" font-weight="600" fill="#1a1c22" text-anchor="middle">2</text>
<text x="352.3" y="70" font-size="13.8" font-weight="600" fill="#5c6270" text-anchor="start">−1</text>
<circle cx="368.3" cy="131" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
