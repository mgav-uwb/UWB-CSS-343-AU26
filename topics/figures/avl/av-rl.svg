<text x="70.8" y="161.6" font-size="13.2" font-weight="400" fill="#5c6270" text-anchor="middle">insert 2</text>
<text x="199.5" y="72" font-size="24" font-weight="400" fill="#5c6270" text-anchor="middle">→</text>
<text x="199.5" y="91.2" font-size="13.8" font-weight="400" fill="#5c6270" text-anchor="middle">rotateRight(3)</text>
