<svg xmlns="http://www.w3.org/2000/svg" width="558" height="407" viewBox="0 0 558 407" role="img" font-family="system-ui, sans-serif" aria-label="A delete leaves a node at balance factor +2; its left child's balance factor picks the fix. Left child at +1: in 3(2(1, ·), ·), rotateRight(3) gives 2(1, 3), and the subtree's height drops from 2 to 1. Left child at 0: in 5(3(2, 4), ·), rotateRight(5) gives 3(2, 5(4, ·)), and the height stays 2. Left child at −1: in 3(1(·, 2), ·), rotateLeft(1), then rotateRight(3), gives 2(1, 3), and the height drops to 1. The right-heavy cases are the mirror images.">
