<svg xmlns="http://www.w3.org/2000/svg" width="460" height="184" viewBox="0 0 460 184" role="img" font-family="system-ui, sans-serif" aria-label="Three small trees and the balance factor of each root: a root with two leaf children has bf 0 (allowed); a root with only a left leaf has bf +1 (allowed); a root whose left child has a left child of its own, and no right child, has bf +2, which breaks the AVL invariant.">
<rect width="460" height="184" fill="#fff"/>
<text x="60.1" y="25.6" font-size="14.4" font-weight="600" fill="#2a2d36" text-anchor="middle">balanced</text>
<line x1="55" y1="55" x2="25" y2="97" stroke="#4a5163" stroke-width="1.6"/>
<line x1="55" y1="55" x2="85" y2="97" stroke="#4a5163" stroke-width="1.6"/>
<circle cx="25" cy="97" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
<circle cx="55" cy="55" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
<text x="73" y="44" font-size="13.8" font-weight="600" fill="#5c6270" text-anchor="start">bf 0</text>
<circle cx="85" cy="97" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
<text x="60.1" y="127.6" font-size="13.8" font-weight="600" fill="#0a7d4d" text-anchor="middle">allowed</text>
<text x="207.7" y="25.6" font-size="14.4" font-weight="600" fill="#2a2d36" text-anchor="middle">leans left by 1</text>
<line x1="198.5" y1="55" x2="168.5" y2="97" stroke="#4a5163" stroke-width="1.6"/>
<circle cx="168.5" cy="97" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
<circle cx="198.5" cy="55" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
<text x="216.5" y="44" font-size="13.8" font-weight="600" fill="#5c6270" text-anchor="start">bf +1</text>
<text x="207.7" y="127.6" font-size="13.8" font-weight="600" fill="#0a7d4d" text-anchor="middle">allowed</text>
<text x="377.3" y="25.6" font-size="14.4" font-weight="600" fill="#2a2d36" text-anchor="middle">leans left by 2</text>
<line x1="353.1" y1="97" x2="323.1" y2="139" stroke="#4a5163" stroke-width="1.6"/>
<line x1="383.1" y1="55" x2="353.1" y2="97" stroke="#4a5163" stroke-width="1.6"/>
<circle cx="323.1" cy="139" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
<circle cx="353.1" cy="97" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
<circle cx="383.1" cy="55" r="15" fill="#fff" stroke="#2a2d36" stroke-width="1.6"/>
<text x="401.1" y="44" font-size="13.8" font-weight="600" fill="#c0392b" text-anchor="start">bf +2</text>
<text x="377.3" y="169.6" font-size="13.8" font-weight="600" fill="#c0392b" text-anchor="middle">breaks the invariant</text>
</svg>
